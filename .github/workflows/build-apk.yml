
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: |
          mkdir -p project
          unzip -q ElixirOverlay-Android-MVP-with-cloud-build.zip -d project

      - name: Find Android project
        id: project
        run: |
          FILE="$(find project -type f -name settings.gradle.kts | head -n 1)"
          test -n "$FILE" || {
            echo "Android project not found"
            exit 1
          }
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Fix Java and Kotlin targets
        run: |
          FILE="$(find project -type f -path '*/app/build.gradle.kts' | head -n 1)"
          test -n "$FILE" || {
            echo "app/build.gradle.kts not found"
            exit 1
          }
          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          if "compileOptions {" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""",
                  1
              )

          if "kotlinOptions {" not in s:
              s = s.replace(
                  "android {",
                  """android {
              kotlinOptions {
                  jvmTarget = "17"
              }""",
                  1
              )

          s = s.replace(
              "sourceCompatibility = JavaVersion.VERSION_1_8",
              "sourceCompatibility = JavaVersion.VERSION_17"
          )
          s = s.replace(
              "targetCompatibility = JavaVersion.VERSION_1_8",
              "targetCompatibility = JavaVersion.VERSION_17"
          )
          s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')

          p.write_text(s)
          print("Updated:", p)
          PY

      - name: Build APK
        run: gradle -p "${{ steps.project.outputs.dir }}" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElixirOverlay-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
