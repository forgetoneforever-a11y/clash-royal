
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack project
        run: |
          ZIP_FILE="$(find . -maxdepth 1 -name '*.zip' -type f | head -n 1)"
          test -n "$ZIP_FILE" || { echo "ZIP not found"; exit 1; }
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

      - name: Find Gradle wrapper
        id: gradle
        run: |
          WRAPPER="$(find project -type f -name gradlew | head -n 1)"
          test -n "$WRAPPER" || {
            echo "gradlew not found in ZIP"
            exit 1
          }
          echo "dir=$(dirname "$WRAPPER")" >> "$GITHUB_OUTPUT"
          chmod +x "$WRAPPER"

      - name: Build APK
        working-directory: ${{ steps.gradle.outputs.dir }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElixirOverlay-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
