name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack project
        run: |
          mkdir -p project
          unzip -q ElixirOverlay-Android-MVP-with-cloud-build.zip -d project

      - name: Find Android project
        id: project
        run: |
          FILE="$(find project -type f -name settings.gradle.kts | head -n 1)"
          test -n "$FILE" || { echo "Android project not found"; exit 1; }
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: gradle -p "${{ steps.project.outputs.dir }}" --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ElixirOverlay-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
